[project]
name = "mlops-copilot-agent"
version = "1.0.0"
description = "Production-style MLOps AI agent that reasons over DVC, MLflow, Apache Airflow and Kubernetes using structured tool calls."
readme = "README.md"
requires-python = ">=3.11,<3.13"
authors = [{ name = "Syed Kalbe Raza", email = "razanaqvi813@gmail.com" }]
license = { text = "MIT" }
dependencies = [
    "dvc>=3.60,<4",
    "mlflow>=3.5,<4",
    "scikit-learn>=1.5,<2",
    "pandas>=2.2,<3",
    "joblib>=1.4",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "kubernetes>=31",
    "httpx>=0.27,<1",
    "pydantic>=2.8,<3",
    "google-genai>=1.0",
    "python-dotenv>=1.0",
    "rich>=13.7",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "ruff>=0.6",
]

[project.scripts]
mlops-agent = "agent.main:main"

[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["agent*", "api*", "training*"]

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = [".venv", ".venv-airflow", "airflow_home"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM"]
ignore = [
    "S101",  # assert is fine in tests
    "S603",  # subprocess calls use fixed allow-listed argv (never shell=True)
    "S607",  # dvc/git resolved from PATH on purpose
    "B008",  # FastAPI dependency defaults
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S", "B011"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -q"
markers = [
    "integration: requires live services (skipped in CI unless MLOPS_INTEGRATION=1)",
]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::FutureWarning",
    "ignore::UserWarning",
]
